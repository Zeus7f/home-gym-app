# nginx برای Home Gym — در /etc/nginx/conf.d/ یا sites-available قرار دهید
# دامنه و مسیر گواهی را جایگزین کنید؛ گواهی: certbot --nginx -d gymvero.el-sabor.ir

# حداکثر ۱۰ درخواست در دقیقه به مسیر ورود برای هر IP (لایهٔ اول؛ سرور هم محدودیت خودش را دارد)
limit_req_zone $binary_remote_addr zone=homegym_login:10m rate=10r/m;

upstream homegym_app {
  server 127.0.0.1:3000;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name gymvero.el-sabor.ir;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name gymvero.el-sabor.ir;

  ssl_certificate     /etc/letsencrypt/live/gymvero.el-sabor.ir/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/gymvero.el-sabor.ir/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;

  client_max_body_size 2m;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;

  location = /api/auth/login {
    limit_req zone=homegym_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://homegym_app;
  }

  location / {
    proxy_pass http://homegym_app;
  }
}

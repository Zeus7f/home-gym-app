# Home Gym — PostgreSQL + برنامه (Express + فرانت‌اند ساخته‌شده)
#
# توسعهٔ محلی (فقط دیتابیس):    docker compose up -d db
# اجرای کامل روی سرور:          docker compose --profile app up -d --build
#   (سرویس‌ها: db، app، و backup برای پشتیبان روزانه در ./backups)
#
# متغیرها از فایل .env کنار همین فایل خوانده می‌شوند (نمونه: .env.example).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homegym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homegym_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-homegym}
    ports:
      # فقط روی localhost؛ روی سرور دیتابیس از بیرون در دسترس نیست
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homegym} -d ${POSTGRES_DB:-homegym}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: homegym-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-homegym}:${POSTGRES_PASSWORD:-homegym_dev_password}@db:5432/${POSTGRES_DB:-homegym}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    ports:
      # فقط روی localhost؛ از بیرون فقط از راه nginx (HTTPS)
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    profiles: ["app"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # پشتیبان روزانهٔ دیتابیس (scripts/backup/backup.sh)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    environment:
      TZ: Asia/Tehran
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-homegym}
      PGPASSWORD: ${POSTGRES_PASSWORD:-homegym_dev_password}
      PGDATABASE: ${POSTGRES_DB:-homegym}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./scripts/backup:/scripts:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    healthcheck:
      # سالم یعنی در ۲۶ ساعت گذشته یک پشتیبان موفق وجود دارد
      test: ["CMD-SHELL", "grep -q '^ok' /backups/last-status && test -n \"$$(find /backups -maxdepth 1 -name 'homegym-*.dump' -mmin -1560)\""]
      interval: 10m
      timeout: 10s
      start_period: 2m
    profiles: ["app", "backup"]

volumes:
  pgdata:

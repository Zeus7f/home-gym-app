<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Gym Platform — سامانه مدیریت باشگاه ورزشی</title>
    <meta name="description" content="سامانه هوشمند و عملیاتی مدیریت باشگاه، مربیان، ورزشکاران و حرکات ورزشی" />
    <meta name="theme-color" content="#0D9488" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230D9488'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='56' font-weight='bold' fill='white'>H</text></svg>" />
    <script>
      // Pre-hydration lang and theme setup to prevent layout/theme flash
      try {
        const savedLang = localStorage.getItem('hg_lang') || 'fa';
        document.documentElement.lang = savedLang;
        document.documentElement.dir = savedLang === 'fa' ? 'rtl' : 'ltr';
        // 'system' (یا مقدار نامعتبر) باید پیش از رندر به light/dark واقعی تبدیل شود.
        const storedTheme = localStorage.getItem('hg_theme');
        const preference = storedTheme === 'light' || storedTheme === 'dark' ? storedTheme : 'system';
        const effectiveTheme = preference === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : preference;
        document.documentElement.setAttribute('data-theme', effectiveTheme);
        document.documentElement.style.colorScheme = effectiveTheme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
